syntax = "proto3";

package avoid.manager;

import "avoid/messages.proto";

option go_package = "github.com/slackhq/nebula/avoid";

service AvoidManager {
  rpc ListConnections (ListRequest) returns (ListReply) {}
  rpc GetStats (StatsRequest) returns (StatsReply) {}
  rpc Migrate (MigrateRequest) returns (MigrateReply) {}
  rpc Disconnect (DisconnectRequest) returns (DisconnectReply) {}
}


message ConnectionReply {
  avoid.messages.ActionMessage Action = 1;
  repeated string value = 2;
}

message DisconnectRequest {
  string name = 1;
  ConnectionReply disconnect = 2;
}
message DisconnectReply{
  avoid.messages.ConnectionInfo disconnect = 1;
}

message ListRequest {}
message ListReply {
  repeated avoid.messages.ConnectionInfo info = 1;
}

message StatsRequest {
  string name = 1;
}
message StatsReply {
  avoid.messages.ConnectionInfo stats = 1;
}

message MigrateRequest {
  string name = 1;
  ConnectionReply migrate = 2;
}
message MigrateReply {
  avoid.messages.ConnectionInfo migrate = 1;
}
