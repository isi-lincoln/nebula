nebula_iface_name: neb1
nebula_network_domain: avoid-nebula
nebula_network_fqdn: avoid-nebula.org
install_user: rvn
overlay:
  'r0':
    ip: 192.168.0.100
    netmask: 24
  'r1':
    ip: 192.168.0.101
    netmask: 24
  'r2':
    ip: 192.168.0.102
    netmask: 24
  'lh':
    ip: 192.168.0.1
    netmask: 24
  'ue1':
    ip: 192.168.0.2
    netmask: 24
  'ue2':
    ip: 192.168.0.3
    netmask: 24
  'avoid':
    ip: 192.168.0.4
    netmask: 24
  'dst1':
    ip: 192.168.0.201
    netmask: 24
  'dst2':
    ip: 192.168.0.202
    netmask: 24
config:
  'r0':
    interfaces:
    - ip: 10.0.0.100
      name: eth1
    - ip: 10.10.0.100
      name: eth2
    - ip: 10.11.0.100
      name: eth3
  'r1':
    interfaces:
    - ip: 10.0.0.101
      name: eth1
    - ip: 10.12.0.101
      name: eth2
    - ip: 10.13.0.101
      name: eth3
  'r2':
    interfaces:
    - ip: 10.0.0.102
      name: eth1
    - ip: 10.14.0.102
      name: eth2
    - ip: 10.15.0.102
      name: eth2
  'lh':
    interfaces:
    - ip: 10.0.0.1
      name: eth1
  'avoid':
    interfaces:
    - ip: 10.0.0.3
      name: eth1
  'dst1':
    interfaces:
    - ip: 10.0.0.201
      name: eth1
  'dst2':
    interfaces:
    - ip: 10.0.0.202
      name: eth1
  'ue1':
    interfaces:
    - ip: 10.10.0.11
      name: eth1
      route: 10.0.0.0/8
    - ip: 10.12.0.11
      name: eth2
    - ip: 10.14.0.11
      name: eth3
  'ue2':
    interfaces:
    - ip: 10.11.0.12
      name: eth1
      route: 10.0.0.0/8
    - ip: 10.13.0.12
      name: eth2
    - ip: 10.15.0.12
      name: eth3
