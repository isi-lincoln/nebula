---
# install and configure etcd
- hosts: db
  become: true
  tasks:
    - import_role:
        name: ansible-etcd
      vars:
        keygen: yes
        server: yes
        alias: "{{ inventory_hostname }}"
        address: "{{ inventory_hostname }}.{{ nebula_network_fqdn }}"
        ip: "{{ overlay[inventory_hostname].ip }}"
        auth_hosts:
          - "{{ inventory_hostname }}"
          - "{{ inventory_hostname }}.{{ nebula_network_fqdn }}"
          - "{{ overlay[inventory_hostname].ip }}"
        hosts:
          - alias: "{{ inventory_hostname }}"
            endpoint: "{{inventory_hostname}}=https://{{ overlay[inventory_hostname].ip }}:2380"


